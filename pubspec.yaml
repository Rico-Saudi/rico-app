name: rico_app
description: "ريكو — مساعدك الذكي يدلّك على أقرب مكان وأفضل عرض حسب موقعك في السعودية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^12.0.0
  http: ^1.2.1
  http_parser: ^4.0.2
  url_launcher: ^6.2.6
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  record: ^6.2.1
  path_provider: ^2.1.4
  # يحفظ صور النتائج على القرص، فما تُطلب الصورة نفسها مرتين — هذا وحده
  # يقطع أغلب تكلفة Place Photos، لأن نفس المحلات تتكرر في كل بحث بالمدينة.
  cached_network_image: ^3.4.1
  # لإرفاق السيرة الذاتية ببطاقة صاحب المهنة: file_picker لملف PDF،
  # وimage_picker للكاميرا والمعرض — لأن "السيرة الذاتية" عند أغلب أصحاب
  # المهن ورقة يصوّرونها لا ملفاً يصدّرونه.
  file_picker: ^8.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/foreground.png

  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#006C35"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

# شعار foreground.png أبيض، فخلفية الإطلاق تبقى بالأخضر السعودي لا بالعاجي
# (كان الشعار ليصير غير مرئي عليه). الانتقال أخضر ← تطبيق فاتح مقصود.
flutter_native_splash:
  color: "#006C35"
  image: assets/icon/foreground.png
  android_12:
    color: "#006C35"
    image: assets/icon/foreground.png
  android: true
  ios: true
  web: false
